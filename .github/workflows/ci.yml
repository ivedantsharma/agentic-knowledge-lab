name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Audit Phase 13 benchmark provenance
        run: uv run python scripts/run_phase13_campaign_inventory.py

      - name: Audit Phase 13 common representation contract
        run: uv run python scripts/run_phase13_common_representation_contract.py

      - name: Audit Phase 13 learned policy comparability
        run: uv run python scripts/run_phase13_policy_feasibility_audit.py
