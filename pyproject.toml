[project]
name = "agentic-knowledge-lab"
version = "0.1.0"
description = "Research engineering for agent-native knowledge systems and adversarial knowledge-agent evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sentence-transformers>=3.0,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
